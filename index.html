<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客戶紀錄本</title>
<style>
  :root{
    --ink:#20262b;
    --ink-soft:#5b6570;
    --paper:#f7f6f2;
    --panel:#ffffff;
    --line:#e4e1d8;
    --meeting:#2f6f5e;
    --meeting-bg:#e9f2ee;
    --ad:#b5522c;
    --ad-bg:#f7e9e2;
    --status-pending:#a8721c;
    --status-doing:#2b6cb0;
    --status-done:#3d7a4a;
    --shadow: 0 1px 2px rgba(32,38,43,0.06), 0 4px 16px rgba(32,38,43,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: "Inter", -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px; flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    height:100vh; position:sticky; top:0;
  }
  .brand{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .brand h1{
    font-family: Georgia, "Noto Serif TC", serif;
    font-size:19px; margin:0 0 2px;
    letter-spacing:0.01em;
  }
  .brand p{ margin:0; color:var(--ink-soft); font-size:12px; }

  .sidebar-search{ padding:14px 16px 8px; }
  .sidebar-search input{
    width:100%; padding:9px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper);
    font-size:13px; outline:none;
  }
  .sidebar-search input:focus{ border-color:var(--meeting); }

  .client-list{ flex:1; overflow-y:auto; padding:4px 10px 10px; }
  .client-item{
    padding:11px 12px; border-radius:9px; cursor:pointer;
    margin-bottom:3px; border:1px solid transparent;
    transition: background .12s ease;
  }
  .client-item:hover{ background:var(--paper); }
  .client-item.active{ background:var(--meeting-bg); border-color:#cfe4dc; }
  .client-item .name{ font-weight:600; font-size:13.5px; }
  .client-item .meta{ color:var(--ink-soft); font-size:11.5px; margin-top:2px; }
  .client-item .count{
    display:inline-block; margin-top:5px; font-size:10.5px;
    color:var(--ink-soft);
  }

  .client-group-label{
    font-size:11px; font-weight:700; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.04em;
    padding:14px 12px 6px;
  }
  .client-group-label.ended{ color:#a8a196; }

  .add-client-btn{
    margin:10px 16px 16px; padding:10px;
    background:var(--ink); color:#fff; border:none; border-radius:9px;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  .add-client-btn:hover{ opacity:.9; }

  /* ---------- Main ---------- */
  .main{ flex:1; padding:28px 40px; max-width:920px; }
  .empty-state{
    display:flex; flex-direction:column; align-items:flex-start;
    justify-content:center; height:70vh; color:var(--ink-soft); max-width:420px;
  }
  .empty-state h2{ color:var(--ink); font-family:Georgia,"Noto Serif TC",serif; font-size:22px; margin-bottom:6px;}

  .client-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--line);
  }
  .client-header h2{
    font-family: Georgia, "Noto Serif TC", serif;
    font-size:26px; margin:0 0 6px;
  }
  .client-header .sub{ color:var(--ink-soft); font-size:13px; }
  .client-header .sub span{ margin-right:14px; }
  .header-actions{ display:flex; gap:8px; }
  .btn{
    padding:9px 15px; border-radius:8px; font-size:13px; font-weight:600;
    cursor:pointer; border:1px solid var(--line); background:var(--panel);
    color:var(--ink);
  }
  .btn:hover{ background:var(--paper); }
  .btn-primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn-primary:hover{ opacity:.9; }
  .btn-danger{ color:#a13a2b; }

  .pinned-note{
    background:#fdf6e3; border:1px solid #ecd9a0; border-radius:12px;
    padding:14px 18px; margin-bottom:20px; position:relative;
  }
  .pinned-note-label{ font-size:11.5px; font-weight:700; color:#a8721c; margin-bottom:6px; }
  .pinned-note-text{ font-size:13.5px; line-height:1.65; color:var(--ink); white-space:pre-wrap; }
  .pinned-note-edit{
    position:absolute; top:14px; right:16px; font-size:11.5px;
  }
  .pinned-note.editing textarea{
    width:100%; min-height:80px; border:1px solid #ecd9a0; border-radius:8px;
    padding:10px; font-family:inherit; font-size:13.5px; outline:none; resize:vertical;
  }
  .pinned-note-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
  .pinned-note-empty{
    color:var(--ink-soft); font-size:12.5px; border:1px dashed var(--line); border-radius:10px;
    padding:10px 14px; margin-bottom:20px; cursor:pointer; display:inline-block;
  }
  .pinned-note-empty:hover{ border-color:var(--meeting); color:var(--meeting); }

  .tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .tab{
    padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:600;
    cursor:pointer; border:1px solid var(--line); color:var(--ink-soft); background:var(--panel);
  }
  .tab.active-all{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .tab.active-meeting{ background:var(--meeting); color:#fff; border-color:var(--meeting); }
  .tab.active-ad{ background:var(--ad); color:#fff; border-color:var(--ad); }

  .records{ display:flex; flex-direction:column; gap:10px; }
  .record-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .record-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .tag{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
    letter-spacing:.02em; white-space:nowrap;
  }
  .tag-meeting{ background:var(--meeting-bg); color:var(--meeting); }
  .tag-ad{ background:var(--ad-bg); color:var(--ad); }
  .record-date{ font-family: "SFMono-Regular", Consolas, monospace; font-size:12.5px; color:var(--ink-soft); }
  .record-owner{ font-size:12px; color:var(--ink-soft); }
  .record-actions{ display:flex; gap:8px; }
  .icon-btn{
    border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:12px;
    text-decoration:underline; padding:0;
  }
  .icon-btn:hover{ color:var(--ink); }

  .record-body{ margin-top:10px; font-size:13.5px; line-height:1.65; }
  .kv{ display:grid; grid-template-columns:88px 1fr; gap:4px 10px; margin-top:8px; font-size:13px; }
  .kv .k{ color:var(--ink-soft); }
  .status-pill{ font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; }
  .status-待處理{ background:#fbeecd; color:var(--status-pending); }
  .status-進行中{ background:#dbeafd; color:var(--status-doing); }
  .status-已完成{ background:#dcf0e0; color:var(--status-done); }
  .note{ margin-top:8px; color:var(--ink-soft); font-size:12.5px; border-top:1px dashed var(--line); padding-top:8px;}
  .before-after{ font-family:"SFMono-Regular", Consolas, monospace; }
  .arrow{ color:var(--ink-soft); margin:0 6px; }

  .record-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .mini-tag{
    font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px;
    background:#eef0ee; color:var(--ink-soft); border:1px solid var(--line);
  }

  .no-records{ color:var(--ink-soft); padding:40px 0; text-align:center; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(32,38,43,0.4);
    display:flex; align-items:center; justify-content:center; z-index:50;
  }
  .modal{
    background:var(--panel); border-radius:14px; padding:26px;
    width:460px; max-width:92vw; max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal h3{ font-family:Georgia,"Noto Serif TC",serif; font-size:19px; margin:0 0 18px; }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line);
    font-size:13.5px; font-family:inherit; outline:none; background:var(--paper);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--meeting); }
  .field textarea{ resize:vertical; min-height:64px; }
  .type-toggle{ display:flex; gap:8px; margin-bottom:16px; }
  .type-toggle button{
    flex:1; padding:10px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper); cursor:pointer; font-weight:600; font-size:13px; color:var(--ink-soft);
  }
  .type-toggle button.sel-meeting{ background:var(--meeting-bg); border-color:var(--meeting); color:var(--meeting); }
  .type-toggle button.sel-ad{ background:var(--ad-bg); border-color:var(--ad); color:var(--ad); }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }

  .tag-input-box{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    border:1px solid var(--line); border-radius:8px; padding:7px 9px;
    background:var(--paper); cursor:text;
  }
  .tag-input-box:focus-within{ border-color:var(--meeting); }
  .tag-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag-chip{
    display:flex; align-items:center; gap:5px;
    background:var(--meeting-bg); color:var(--meeting);
    font-size:12px; font-weight:600; padding:3px 4px 3px 10px; border-radius:14px;
  }
  .tag-chip button{
    border:none; background:none; cursor:pointer; color:var(--meeting);
    font-size:14px; line-height:1; padding:0 4px;
  }
  #f_tagInput{
    border:none; outline:none; flex:1; min-width:100px; padding:3px 4px;
    background:transparent; font-size:13px;
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:-6px; margin-bottom:14px;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <h1>客戶紀錄本</h1>
      <p>會議紀錄・廣告調整歷程</p>
    </div>
    <div class="sidebar-search">
      <input type="text" id="clientSearch" placeholder="搜尋客戶...">
    </div>
    <div class="client-list" id="clientList"></div>
    <button class="add-client-btn" onclick="openClientModal()">+ 新增客戶</button>
  </div>

  <div class="main" id="main"></div>
</div>

<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

// 你的 Firebase 設定
const firebaseConfig = {
  apiKey: "AIzaSyCeX_ueSu7rH8a_wfS48TyaVjfrppff9Ag",
  authDomain: "client-log-66ec7.firebaseapp.com",
  projectId: "client-log-66ec7",
  storageBucket: "client-log-66ec7.firebasestorage.app",
  messagingSenderId: "35329048007",
  appId: "1:35329048007:web:ceb13cb9546cb367a36de2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const clientsCol = collection(db, 'clients');
const recordsCol = collection(db, 'records');

let clients = [];
let records = [];
let activeClientId = null;
let activeTab = 'all';
let editingRecordId = null;
let recordType = 'meeting';
let currentTags = [];
let pinnedNoteEditing = false;

function getAllTags(){
  const set = new Set();
  records.forEach(r => (r.tags||[]).forEach(t => set.add(t)));
  return [...set].sort((a,b) => a.localeCompare(b, 'zh-Hant'));
}

function renderTagChips(){
  const box = document.getElementById('tagChips');
  if(!box) return;
  box.innerHTML = currentTags.map((t,i) => `
    <span class="tag-chip">${escapeHtml(t)}<button type="button" onclick="removeTag(${i})">×</button></span>
  `).join('');
}

function addTagFromInput(){
  const input = document.getElementById('f_tagInput');
  const val = input.value.trim();
  if(val && !currentTags.includes(val)){
    currentTags.push(val);
    renderTagChips();
  }
  input.value = '';
}

function handleTagKeydown(event){
  if(event.key === 'Enter' || event.key === ','){
    event.preventDefault();
    addTagFromInput();
  }
}

function removeTag(index){
  currentTags.splice(index, 1);
  renderTagChips();
}

// 即時監聽：Firestore 上的資料一有變動（不管是誰改的），畫面會自動更新
function loadData(){
  onSnapshot(clientsCol, snap => {
    clients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderClientList();
    renderMain();
  }, err => console.error('讀取客戶資料失敗', err));

  onSnapshot(recordsCol, snap => {
    records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderClientList();
    renderMain();
  }, err => console.error('讀取紀錄資料失敗', err));
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function renderClientList(){
  const list = document.getElementById('clientList');
  const q = (document.getElementById('clientSearch').value || '').trim().toLowerCase();
  const filtered = clients.filter(c => c.name.toLowerCase().includes(q));
  if(filtered.length === 0){
    list.innerHTML = `<div style="padding:20px 12px;color:var(--ink-soft);font-size:12.5px;">${clients.length===0 ? '還沒有客戶，點下方新增' : '找不到符合的客戶'}</div>`;
    return;
  }

  const active = filtered.filter(c => c.status !== '已結束合作');
  const ended = filtered.filter(c => c.status === '已結束合作');

  const renderGroup = (arr) => arr.map(c => `
    <div class="client-item ${c.id===activeClientId?'active':''}" onclick="selectClient('${c.id}')">
      <div class="name">${escapeHtml(c.name)}</div>
    </div>
  `).join('');

  let html = '';
  if(active.length){
    html += `<div class="client-group-label">合作中</div>${renderGroup(active)}`;
  }
  if(ended.length){
    html += `<div class="client-group-label ended">已結束合作</div>${renderGroup(ended)}`;
  }
  list.innerHTML = html;
}

function selectClient(id){
  activeClientId = id;
  activeTab = 'all';
  pinnedNoteEditing = false;
  renderClientList();
  renderMain();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderMain(){
  const main = document.getElementById('main');
  const client = clients.find(c => c.id === activeClientId);
  if(!client){
    main.innerHTML = `<div class="empty-state">
      <h2>選一個客戶，或新增一個開始</h2>
      <p>每個客戶都有獨立頁面，記錄會議內容跟廣告調整歷程，公司同事看到的是同一份資料。</p>
    </div>`;
    return;
  }

  const clientRecords = records
    .filter(r => r.clientId === client.id)
    .filter(r => activeTab === 'all' ? true : r.type === activeTab)
    .sort((a,b) => b.date.localeCompare(a.date));

  main.innerHTML = `
    <div class="client-header">
      <div>
        <h2>${escapeHtml(client.name)}</h2>
        <div class="sub">
          <span>窗口：${escapeHtml(client.contact || '—')}</span>
          <span>負責人：${escapeHtml(client.owner || '—')}</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" onclick="openClientModal('${client.id}')">編輯客戶</button>
        <button class="btn btn-primary" onclick="openRecordModal(null)">+ 新增紀錄</button>
      </div>
    </div>

    ${renderPinnedNote(client)}

    <div class="tabs">
      <div class="tab ${activeTab==='all'?'active-all':''}" onclick="setTab('all')">全部</div>
      <div class="tab ${activeTab==='meeting'?'active-meeting':''}" onclick="setTab('meeting')">會議記錄</div>
      <div class="tab ${activeTab==='ad'?'active-ad':''}" onclick="setTab('ad')">廣告調整</div>
    </div>

    <div class="records">
      ${clientRecords.length === 0 ? `<div class="no-records">目前沒有紀錄，點右上角「新增紀錄」開始記錄</div>` : clientRecords.map(renderRecordCard).join('')}
    </div>
  `;
}

function renderPinnedNote(client){
  if(pinnedNoteEditing){
    return `
      <div class="pinned-note editing">
        <textarea id="pinnedNoteInput" placeholder="寫下這個客戶的固定事項，例如：發票抬頭、每月結算日、特殊禁忌...">${escapeHtml(client.pinnedNote || '')}</textarea>
        <div class="pinned-note-actions">
          <button class="btn" onclick="cancelPinnedNote()">取消</button>
          <button class="btn btn-primary" onclick="savePinnedNote('${client.id}')">儲存</button>
        </div>
      </div>
    `;
  }
  if(client.pinnedNote){
    return `
      <div class="pinned-note">
        <div class="pinned-note-label">📌 固定備註</div>
        <div class="pinned-note-text">${escapeHtml(client.pinnedNote).replace(/\n/g,'<br>')}</div>
        <button class="icon-btn pinned-note-edit" onclick="pinnedNoteEditing=true; renderMain();">編輯</button>
      </div>
    `;
  }
  return `<div class="pinned-note-empty" onclick="pinnedNoteEditing=true; renderMain();">+ 新增固定備註</div>`;
}

function cancelPinnedNote(){
  pinnedNoteEditing = false;
  renderMain();
}

async function savePinnedNote(clientId){
  const text = document.getElementById('pinnedNoteInput').value.trim();
  try{
    await updateDoc(doc(clientsCol, clientId), { pinnedNote: text });
  }catch(e){
    alert('儲存失敗，請確認網路連線');
    console.error(e);
    return;
  }
  pinnedNoteEditing = false;
}

function setTab(t){ activeTab = t; renderMain(); }

function renderRecordCard(r){
  const tagsHtml = (r.tags && r.tags.length) ? `<div class="record-tags">${r.tags.map(t => `<span class="mini-tag">${escapeHtml(t)}</span>`).join('')}</div>` : '';

  if(r.type === 'meeting'){
    return `<div class="record-card">
      <div class="record-top">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="tag tag-meeting">會議記錄</span>
          <span class="record-date">${r.date}</span>
          ${r.owner ? `<span class="record-owner">${escapeHtml(r.owner)}</span>` : ''}
        </div>
        <div class="record-actions">
          <button class="icon-btn" onclick="openRecordModal('${r.id}')">編輯</button>
          <button class="icon-btn" onclick="deleteRecord('${r.id}')">刪除</button>
        </div>
      </div>
      <div class="record-body">
        ${r.content ? escapeHtml(r.content).replace(/\n/g,'<br>') : ''}
        <div class="kv">
          <div class="k">狀態</div><div><span class="status-pill status-${r.status}">${r.status}</span></div>
        </div>
      </div>
      ${tagsHtml}
      ${r.note ? `<div class="note">備註：${escapeHtml(r.note)}</div>` : ''}
    </div>`;
  } else {
    return `<div class="record-card">
      <div class="record-top">
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="tag tag-ad">廣告調整</span>
          <span class="record-date">${r.date}</span>
          ${r.owner ? `<span class="record-owner">${escapeHtml(r.owner)}</span>` : ''}
        </div>
        <div class="record-actions">
          <button class="icon-btn" onclick="openRecordModal('${r.id}')">編輯</button>
          <button class="icon-btn" onclick="deleteRecord('${r.id}')">刪除</button>
        </div>
      </div>
      <div class="record-body">
        ${r.content ? escapeHtml(r.content).replace(/\n/g,'<br>') : ''}
      </div>
      ${tagsHtml}
      ${r.note ? `<div class="note">備註：${escapeHtml(r.note)}</div>` : ''}
    </div>`;
  }
}

/* ---------- Client Modal ---------- */
function openClientModal(id){
  const editing = id ? clients.find(c => c.id === id) : null;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${editing ? '編輯客戶' : '新增客戶'}</h3>
        <div class="field"><label>客戶名 *</label><input id="f_name" value="${editing?escapeHtml(editing.name):''}"></div>
        <div class="field"><label>聯絡窗口</label><input id="f_contact" value="${editing?escapeHtml(editing.contact||''):''}"></div>
        <div class="field"><label>負責人</label><input id="f_owner" value="${editing?escapeHtml(editing.owner||''):''}"></div>
        <div class="field"><label>合作狀態</label>
          <select id="f_clientStatus">
            <option value="合作中" ${!editing||editing.status!=='已結束合作'?'selected':''}>合作中</option>
            <option value="已結束合作" ${editing&&editing.status==='已結束合作'?'selected':''}>已結束合作</option>
          </select>
        </div>
        <div class="modal-actions">
          ${editing ? `<button class="btn btn-danger" onclick="deleteClient('${editing.id}')" style="margin-right:auto;">刪除客戶</button>` : ''}
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveClient('${editing?editing.id:''}')">儲存</button>
        </div>
      </div>
    </div>
  `;
}

async function saveClient(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('請輸入客戶名'); return; }
  const contact = document.getElementById('f_contact').value.trim();
  const owner = document.getElementById('f_owner').value.trim();
  const status = document.getElementById('f_clientStatus').value;
  const targetId = id || uid();
  try{
    await setDoc(doc(clientsCol, targetId), { name, contact, owner, status }, { merge: true });
  }catch(e){
    alert('儲存失敗，請確認網路連線或 Firebase 設定');
    console.error(e);
    return;
  }
  if(!id) activeClientId = targetId;
  closeModal();
}

async function deleteClient(id){
  if(!confirm('確定要刪除這個客戶嗎？相關的所有紀錄也會一併刪除。')) return;
  const relatedRecords = records.filter(r => r.clientId === id);
  if(activeClientId === id) activeClientId = null;
  try{
    await deleteDoc(doc(clientsCol, id));
    await Promise.all(relatedRecords.map(r => deleteDoc(doc(recordsCol, r.id))));
  }catch(e){
    alert('刪除失敗，請確認網路連線或 Firebase 設定');
    console.error(e);
    return;
  }
  closeModal();
  renderMain();
}

/* ---------- Record Modal ---------- */
function openRecordModal(id){
  editingRecordId = id;
  const editing = id ? records.find(r => r.id === id) : null;
  recordType = editing ? editing.type : 'meeting';
  renderRecordModal(editing);
}

function switchType(t){
  recordType = t;
  renderRecordModal(editingRecordId ? records.find(r=>r.id===editingRecordId) : null);
}

function renderRecordModal(editing){
  const root = document.getElementById('modalRoot');
  const today = new Date().toISOString().slice(0,10);

  const commonTop = `
    <div class="type-toggle">
      <button class="${recordType==='meeting'?'sel-meeting':''}" onclick="switchType('meeting')">會議記錄</button>
      <button class="${recordType==='ad'?'sel-ad':''}" onclick="switchType('ad')">廣告調整</button>
    </div>
    <div class="row2">
      <div class="field"><label>日期 *</label><input type="date" id="f_date" value="${editing?editing.date:today}"></div>
      <div class="field"><label>負責人</label><input id="f_owner" value="${editing?escapeHtml(editing.owner||''):''}"></div>
    </div>
  `;

  let typeFields = '';
  if(recordType === 'meeting'){
    typeFields = `
      <div class="field"><label>內容 *</label><textarea id="f_content" placeholder="這次會議討論了什麼...">${editing?escapeHtml(editing.content||''):''}</textarea></div>
      <div class="field"><label>狀態</label>
        <select id="f_status">
          <option ${editing&&editing.status==='待處理'?'selected':''}>待處理</option>
          <option ${editing&&editing.status==='進行中'?'selected':''}>進行中</option>
          <option ${!editing||editing.status==='已完成'?'selected':''}>已完成</option>
        </select>
      </div>
    `;
  } else {
    typeFields = `
      <div class="field"><label>調整內容 *</label><textarea id="f_content" placeholder="這次調整了什麼，例如：FB 新增「賢止謙謙」影片素材">${editing?escapeHtml(editing.content||''):''}</textarea></div>
    `;
  }

  currentTags = editing && editing.tags ? [...editing.tags] : [];
  const tagField = `
    <div class="field">
      <label>標籤</label>
      <div class="tag-input-box" onclick="document.getElementById('f_tagInput').focus()">
        <div class="tag-chips" id="tagChips"></div>
        <input type="text" id="f_tagInput" placeholder="輸入後按 Enter 新增" list="tagSuggestions" onkeydown="handleTagKeydown(event)">
      </div>
      <datalist id="tagSuggestions">${getAllTags().map(t => `<option value="${escapeHtml(t)}">`).join('')}</datalist>
    </div>
  `;

  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${editing ? '編輯紀錄' : '新增紀錄'}</h3>
        ${commonTop}
        ${typeFields}
        ${tagField}
        <div class="field"><label>備註</label><textarea id="f_note" placeholder="其他補充...">${editing?escapeHtml(editing.note||''):''}</textarea></div>
        <div class="modal-actions">
          ${editing ? `<button class="btn btn-danger" onclick="deleteRecord('${editing.id}')" style="margin-right:auto;">刪除</button>` : ''}
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveRecord()">儲存</button>
        </div>
      </div>
    </div>
  `;
  renderTagChips();
}

async function saveRecord(){
  const date = document.getElementById('f_date').value;
  if(!date){ alert('請選擇日期'); return; }
  const owner = document.getElementById('f_owner').value.trim();
  const note = document.getElementById('f_note').value.trim();
  const content = document.getElementById('f_content').value.trim();
  if(!content){ alert(recordType==='meeting' ? '請填寫內容' : '請填寫調整內容'); return; }

  let data = { clientId: activeClientId, type: recordType, date, owner, note, content, tags: currentTags.slice() };

  if(recordType === 'meeting'){
    data.status = document.getElementById('f_status').value;
  }

  const targetId = editingRecordId || uid();
  try{
    await setDoc(doc(recordsCol, targetId), data);
  }catch(e){
    alert('儲存失敗，請確認網路連線或 Firebase 設定');
    console.error(e);
    return;
  }
  closeModal();
}

async function deleteRecord(id){
  if(!confirm('確定要刪除這筆紀錄嗎？')) return;
  try{
    await deleteDoc(doc(recordsCol, id));
  }catch(e){
    alert('刪除失敗，請確認網路連線或 Firebase 設定');
    console.error(e);
    return;
  }
  closeModal();
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  editingRecordId = null;
}

document.getElementById('clientSearch').addEventListener('input', renderClientList);

// 因為用了 type="module"，這裡的函式不會自動變成全域函式，
// 但畫面上的按鈕是用 onclick="xxx()" 呼叫的，所以要手動掛到 window 上
window.closeModal = closeModal;
window.deleteClient = deleteClient;
window.deleteRecord = deleteRecord;
window.openClientModal = openClientModal;
window.openRecordModal = openRecordModal;
window.saveClient = saveClient;
window.saveRecord = saveRecord;
window.selectClient = selectClient;
window.setTab = setTab;
window.switchType = switchType;
window.handleTagKeydown = handleTagKeydown;
window.removeTag = removeTag;
window.cancelPinnedNote = cancelPinnedNote;
window.savePinnedNote = savePinnedNote;
window.renderMain = renderMain;
Object.defineProperty(window, 'pinnedNoteEditing', {
  get(){ return pinnedNoteEditing; },
  set(v){ pinnedNoteEditing = v; }
});

loadData();
</script>
